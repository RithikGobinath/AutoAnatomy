[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoanatomy"
version = "0.2.0"
description = "Craniofacial CT segmentation (jaw, teeth, skull, mandibular canal, chewing muscles) with a terminal GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rithik Gobinath" }]

dependencies = [
    "torch>=2.1.2",
    "numpy",
    "nibabel>=2.3.0",
    "tqdm>=4.45.0",
    "nnunetv2>=2.3.1",
    "requests",
    "dicom2nifti",
    "xmltodict",
    "scikit-image",
    "textual>=0.60",
    "rich",
    "itk>=5.1.0",
]

[project.optional-dependencies]
# Only needed for DICOM-SEG / RT-STRUCT export, which isn't wired up in the
# CLI/TUI yet (the underlying engine code path still exists).
dicom-export = ["rt_utils", "highdicom"]
dev = ["pytest"]

[project.scripts]
autoanatomy = "autoanatomy.cli.main:main"
autoanatomy-gui = "autoanatomy.tui.app:run"

[tool.setuptools.packages.find]
include = ["autoanatomy*"]

[tool.setuptools.package-data]
"autoanatomy.engine" = ["resources/*"]
# The prebuilt graph-cut extension and its native rebuild sources (see
# autoanatomy/third_party/femur_segmentation/README.md) -- not .py files, so
# they need explicit package-data globs to ship in a built wheel.
"autoanatomy.third_party.femur_segmentation" = [
    "*.md", "LICENSE",
    "lib/*.pyd", "lib/*.so",
    "native_src/**/*",
]
